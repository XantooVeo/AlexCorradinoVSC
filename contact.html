<!DOCTYPE html>
<!-- Declares the document as HTML5 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Sets the character encoding -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Makes the page responsive -->
<title>Contact Alex</title>
<!-- Title shown in the browser tab -->
<link rel="stylesheet" href="style.css">
<!-- Connects to the external CSS file -->
</head>

<body>
<!-- Contains all visible content on the page -->

<!-- Header and Navigation -->
<header>
  <h1>Contact Me</h1>
  <!-- Main heading for the page -->

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <!-- Link to homepage -->
      <li><a href="about.html">About Me</a></li>
      <!-- Link to About page -->
      <li><a href="contact.html">Contact</a></li>
      <!-- Link to Contact page -->
    </ul>
  </nav>
</header>
<!-- Header provides navigation and page title -->

<!-- Main Content -->
<main>
<section>
  <h2>Get in Touch</h2>
  <!-- Section heading for contact form -->

  <h3>Send me some feedback — I’d love to hear from you!</h3>
  <!-- Short description inviting the user to send a message -->

  <!-- Contact Form -->
  <form action="#" method="post">
  <!-- Basic form setup using POST (no mailto) -->

    <!-- Name Input -->
    <div>
      <label for="full-name">Full Name:</label>
      <input type="text" id="full-name" name="full-name" placeholder="Enter your name" required>
    </div>
    <!-- Collects the visitor's name -->

    <br>

    <!-- Contact Method Dropdown -->
    <div>
      <label for="contact-method">Preferred Way to Contact You:</label>
      <select id="contact-method" name="contact-method">
        <option value="email">Email</option>
        <option value="phone">Phone</option>
        <option value="social">Social Media</option>
      </select>
    </div>
    <!-- Lets the visitor choose how they prefer to be contacted -->

    <br>

    <!-- Radio Buttons -->
    <fieldset>
      <legend>How did you find my site?</legend>

      <label for="friend">
        <input type="radio" id="friend" name="source" value="friend"> Friend/Family
      </label>

      <label for="search">
        <input type="radio" id="search" name="source" value="search"> Search Engine
      </label>

      <label for="other">
        <input type="radio" id="other" name="source" value="other"> Other
      </label>
    </fieldset>
    <!-- Lets the visitor choose how they discovered the website -->

    <br>

    <!-- Message Textarea -->
    <div>
      <label for="message">Your Message:</label><br>
      <textarea id="message" name="message" rows="5" cols="30" placeholder="Type your message here..." required></textarea>
    </div>
    <!-- Allows the visitor to type a message -->

    <br>

    <!-- Submit Button -->
    <button type="submit">Send Message</button>
    <!-- Sends the form data (locally, since no mailto is used) -->

  </form>
</section>
</main>
<!-- Main area holds the contact form -->

<!-- Footer -->
<footer>
  <p>&copy; 2026 Alex Corradino</p>
  <!-- Copyright -->
</footer>

</body>
</html>
