<!DOCTYPE html>
<!-- Declares the document as an HTML5 webpage -->
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Sets the character encoding so text displays correctly -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Makes the page responsive on phones, tablets, and computers -->

<title>Alex's Personal Website</title>
<!-- Title that appears in the browser tab -->

<link rel="stylesheet" href="style.css">
<!-- Connects this page to the external CSS file for styling -->
</head>

<body>
<!-- Contains all visible content on the webpage -->

<!-- Header Section -->
<header>
  <h1>Welcome to My Website</h1>
  <!-- Main heading displayed at the top of the page -->

  <nav>
    <!-- Navigation bar that lets users move between pages -->
    <ul>
      <li><a href="index.html">Home</a></li>
      <!-- Link to the homepage -->

      <li><a href="about.html">About Me</a></li>
      <!-- Link to the About Me page -->

      <li><a href="contact.html">Contact</a></li>
      <!-- Link to the Contact page -->
    </ul>
  </nav>
</header>
<!-- The header introduces the site and provides navigation -->

<!-- Main Content Section -->
<main>
<section>
  <h2>Home Overview</h2>
  <!-- Section heading describing what this page is about -->

  <!-- Photo Section -->
  <img src="alex.jpg" alt="Photo of Alex">
  <!-- Displays a photo of the student -->

  <p>
    Hey! Welcome to my website — a place where I share my interests, hobbies, and a bit about who I am.  
    Feel free to explore and learn more about me!
  </p>
  <!-- Short introduction welcoming visitors to the site -->
</section>
</main>
<!-- Main area holds the primary content of the homepage -->

<!-- Footer Section -->
<footer>
  <p>&copy; 2026 Alex Corradino</p>
  <!-- Copyright notice -->
</footer>
<!-- Footer appears at the bottom of the page -->

</body>
</html>
